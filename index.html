<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#152a47"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>운동 체크</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#172c44;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}header{background:#152a47;color:white;padding:26px 18px}header>div,main{max-width:620px;margin:auto}h1{margin:0 0 7px;font-size:25px}header p{margin:0;color:#b9cee3;font-size:13px}main{padding:14px 12px 50px}.card{background:white;border-radius:17px;padding:17px;margin-bottom:12px;box-shadow:0 3px 14px #1c32450a}.muted{color:#718096;font-size:12px}input[type=date]{font:inherit;width:100%;padding:12px;border:1px solid #d7e2ed;border-radius:10px;margin:10px 0}button{font:inherit;cursor:pointer;border:1px solid #d6e1ec;border-radius:11px;padding:12px;background:white;color:#183b58;font-weight:650}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.week button{padding:12px 0}.week button.active{background:#1768ae;color:white;border-color:#1768ae}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}h2{font-size:19px;margin:0 0 5px}.percent{font-size:25px;font-weight:800;color:#1768ae}.track{height:10px;background:#e8eef5;border-radius:99px;overflow:hidden;margin:13px 0}.fill{height:100%;background:#19a37d;width:0;transition:width .2s}.item{display:flex;align-items:center;gap:12px;border-top:1px solid #edf1f5;padding:14px 0;cursor:pointer}.item:first-child{border:0}.item input{width:25px;height:25px;accent-color:#14875f;flex-shrink:0}.item span{font-weight:650}.item small{display:block;color:#74849a;font-weight:400;margin-top:4px}.item:has(input:checked) span{text-decoration:line-through;color:#82909f}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.primary{background:#1768ae;color:white}.status{font-size:12px;color:#60788b;margin-top:10px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calday{padding:9px 1px;min-height:40px;font-size:12px}.calday.current{outline:2px solid #1768ae}.calday.done{background:#d9f5e7;border-color:#8ad5b2}.calday:disabled{opacity:.25}.calhead{text-align:center;font-size:11px;color:#8795a5;padding:5px}.note{line-height:1.6;font-size:12px;color:#65778a}#notice{font-size:12px;color:#ad5e15}</style></head><body><header><div><h1>💪 나의 운동 체크</h1><p>2026.11.23 ~ 12.31 · 화~일 운동 · 월요일 휴식</p></div></header><main><section class="card"><label for="date"><strong>운동 날짜</strong></label><input id="date" type="date" min="2026-11-23" max="2026-12-31"><div class="week" id="week"></div><div id="notice"></div></section><section class="card"><div class="top"><div><h2 id="title"></h2><div class="muted" id="time"></div></div><div class="percent" id="pct">0%</div></div><div class="track"><div class="fill" id="bar"></div></div><div class="muted" id="count"></div></section><section class="card"><h2>오늘의 체크리스트</h2><div id="items"></div></section><section class="card"><div class="top"><h2>운동 달력</h2><button id="monthBtn">12월 보기</button></div><div class="calendar" id="calendar"></div><div class="status" id="summary"></div></section><section class="card"><div class="actions"><button class="primary" id="backup">기록 백업</button><button id="restore">기록 복원</button><input type="file" id="file" accept="application/json" hidden></div><p class="note">체크하면 이 기기의 브라우저에 자동 저장돼. 다른 기기와 자동 동기화되지는 않아. 중요한 기록은 백업해 줘.</p></section><p class="note">운동 전 5~10분 준비운동을 하고, 처음에는 무리하지 않는 강도로 시작해. 통증이 있으면 운동을 중단해.</p></main><script>
const R={"2": ["가슴 + 삼두", ["벤치프레스", "인클라인 덤벨프레스", "체스트프레스 머신", "팩덱 플라이", "트라이셉스 푸시다운", "오버헤드 트라이셉스 익스텐션"], "빠르게 걷기"], "3": ["등 + 이두", ["랫풀다운", "시티드 로우", "원암 덤벨 로우", "백 익스텐션", "바벨 컬", "덤벨 컬"], "빠르게 걷기"], "4": ["하체", ["스쿼트", "레그프레스", "레그 컬", "레그 익스텐션", "루마니안 데드리프트", "카프 레이즈"], "경사 걷기"], "5": ["어깨 + 복근", ["숄더프레스 머신", "사이드 레터럴 레이즈", "프론트 레이즈", "리버스 팩덱 플라이", "크런치", "레그 레이즈", "플랭크"], "빠르게 걷기"], "6": ["상체 종합", ["인클라인 벤치프레스", "랫풀다운", "시티드 로우", "숄더프레스", "사이드 레터럴 레이즈", "팩덱 플라이"], "가벼운 조깅 또는 걷기"], "0": ["하체 보완 + 코어", ["레그프레스", "런지", "햄스트링 컬", "크런치", "사이드 플랭크", "버드독"], "편안한 걷기"]};const START='2026-11-23',END='2026-12-31',PREFIX='fitness-simple-2026-';const $=id=>document.getElementById(id);const pad=n=>String(n).padStart(2,'0');const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const day=d=>new Date(d+'T12:00:00').getDay();const today=fmt(new Date());let selected=today<START?START:today>END?END:today,month=Number(selected.slice(5,7));let fallback={};let available=true;try{localStorage.setItem('__fit_test','1');localStorage.removeItem('__fit_test')}catch(e){available=false;$('notice').textContent='현재 열기 방식에서는 영구 저장이 제한될 수 있어. 배포된 HTTPS 주소에서 이용해 줘.'}function get(d){try{return JSON.parse(available?localStorage.getItem(PREFIX+d):fallback[d])||{}}catch{return {}}}function set(d,v){if(available){try{localStorage.setItem(PREFIX+d,JSON.stringify(v))}catch(e){available=false;fallback[d]=JSON.stringify(v)}}else fallback[d]=JSON.stringify(v)}function labels(d){let r=R[day(d)];return r?[...r[1].map(n=>({title:n,sub:'3세트 · 10~15회 (플랭크 30초)'})),{title:'러닝머신 · '+r[2],sub:'40분 이상'}]:[]}function completion(d){let a=labels(d),v=get(d);return a.length?{total:a.length,done:a.filter((_,i)=>v[i]).length}:null}function select(d){if(d<START||d>END)return;selected=d;month=Number(d.slice(5,7));render()}function render(){let wd=day(selected),r=R[wd],a=labels(selected),v=get(selected),c=completion(selected);$('date').value=selected;$('week').innerHTML=['일','월','화','수','목','금','토'].map((x,i)=>`<button class="${wd===i?'active':''}" data-w="${i}">${x}</button>`).join('');document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{let d=new Date(selected+'T12:00:00');d.setDate(d.getDate()+Number(b.dataset.w)-wd);select(fmt(d))});$('title').textContent=r?r[0]:'휴식일';$('time').textContent=r?(r[3]||([0,6].includes(wd)?'오전 10:00':'오후 9:00'))+' · 웨이트 약 60분 + 유산소 40분 이상':'월요일은 충분히 쉬어줘';let pct=c?Math.round(c.done/c.total*100):0;$('pct').textContent=c?pct+'%':'휴식';$('bar').style.width=pct+'%';$('count').textContent=c?`${c.done} / ${c.total}개 운동 완료`:'운동 일정 없음';$('items').innerHTML=a.length?a.map((x,i)=>`<label class="item"><input type="checkbox" data-i="${i}" ${v[i]?'checked':''}><span>${x.title}<small>${x.sub}</small></span></label>`).join(''):'<p class="muted">오늘은 쉬는 날이야.</p>';document.querySelectorAll('[data-i]').forEach(e=>e.onchange=()=>{let x=get(selected);x[e.dataset.i]=e.checked;set(selected,x);render()});calendar()}function calendar(){let first=new Date(2026,month-1,1),last=new Date(2026,month,0).getDate();let html=['일','월','화','수','목','금','토'].map(x=>`<div class="calhead">${x}</div>`).join('')+Array(first.getDay()).fill('<div></div>').join('');for(let i=1;i<=last;i++){let d=`2026-${pad(month)}-${pad(i)}`,c=completion(d),complete=c&&c.done===c.total;html+=`<button class="calday ${d===selected?'current':''} ${complete?'done':''}" data-d="${d}" ${d<START||d>END?'disabled':''}>${i}${c&&c.done?'<br><small>'+c.done+'/'+c.total+'</small>':''}</button>`}$('calendar').innerHTML=html;document.querySelectorAll('[data-d]').forEach(e=>e.onclick=()=>select(e.dataset.d));let planned=0,done=0;for(let d=new Date(2026,10,23);d<=new Date(2026,11,31);d.setDate(d.getDate()+1)){let c=completion(fmt(d));if(c){planned++;if(c.done===c.total)done++}}$('summary').textContent=`전체 운동일 ${planned}일 중 완료 ${done}일`;$('monthBtn').textContent=month===11?'12월 보기':'11월 보기'}$('date').onchange=e=>select(e.target.value);$('monthBtn').onclick=()=>{month=month===11?12:11;calendar()};$('backup').onclick=()=>{let records={};for(let d=new Date(2026,10,23);d<=new Date(2026,11,31);d.setDate(d.getDate()+1)){let k=fmt(d);records[k]=get(k)}let blob=new Blob([JSON.stringify({version:1,records},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='운동체크_백업.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)};$('restore').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(x.version!==1||!x.records)throw Error('지원하지 않는 파일');if(confirm('기존 기록을 백업 파일 내용으로 덮어쓸까?')){for(let [d,v] of Object.entries(x.records)){if(d>=START&&d<=END&&v&&typeof v==='object')set(d,v)}render();alert('복원 완료')}}catch(err){alert('복원 실패: '+err.message)}e.target.value=''};if(location.protocol==='https:'&&'serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
